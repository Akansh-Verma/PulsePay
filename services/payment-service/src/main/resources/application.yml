spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${SPRING_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${SPRING_KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${SPRING_KAFKA_SASL_JAAS_CONFIG:}
    producer:
      acks: all

server:
  port: ${SERVER_PORT:${PORT:8082}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

pulsepay:
  cors:
    allowed-origins: ${PULSEPAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    dev.pulsepay: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level thread=%thread logger=%logger{36} traceId=%X{traceId} correlationId=%X{correlationId} msg=%msg%n"

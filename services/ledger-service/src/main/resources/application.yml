spring:
  application:
    name: ledger-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${SPRING_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${SPRING_KAFKA_SASL_MECHANISM:}
      sasl.jaas.config: ${SPRING_KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      group-id: ledger-group
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:${PORT:8084}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    dev.pulsepay: INFO
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%level thread=%thread logger=%logger{36} correlationId=%X{correlationId} msg=%msg%n"
